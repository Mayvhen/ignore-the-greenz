# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Left off on purpose: Loom works out the jar's "client only entries" during
# configuration, so with the configuration cache on the list goes stale as soon
# as a source file is added or renamed (the built jar then names the old paths).
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=1.2.0
group=dev.ignorethegreenz

# Dependencies
fabric_api_version=0.163.0+26.3
